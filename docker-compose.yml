# Base de datos local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtrail
      POSTGRES_PASSWORD: jobtrail
      POSTGRES_DB: jobtrail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrail"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
